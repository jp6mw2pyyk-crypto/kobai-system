<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注文確認</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        .quantity {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 30px;
        }

        .quantity button {
            width: 70px;
            height: 55px;
            font-size: 30px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
        }

        #count {
            font-size: 30px;
            font-weight: bold;
            width: 40px;
        }
    </style>
</head>

<body>

    <h1>注文確認</h1>

    <div class="quantity">

        <button type="button" id="minus">−</button>

        <span id="count">1</span>

        <button type="button" id="plus">＋</button>

    </div>


    <script>

        let count = 1;

        const countElement =
            document.getElementById("count");

        const plusButton =
            document.getElementById("plus");

        const minusButton =
            document.getElementById("minus");


        // ＋ボタン
        plusButton.addEventListener("click", function () {

            count++;

            countElement.textContent = count;

            console.log("現在の個数：" + count);

        });


        // −ボタン
        minusButton.addEventListener("click", function () {

            if (count > 1) {

                count--;

                countElement.textContent = count;

                console.log("現在の個数：" + count);

            }

        });

    </script>

</body>

</html>
