
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注文確認</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: 20px auto;
            padding: 24px;
            background: white;
            border-radius: 12px;
            text-align: center;
        }

        #menuImage {
            width: 100%;
            max-width: 350px;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }

        #selectedMenu {
            font-size: 22px;
            font-weight: bold;
        }

        .quantity {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 22px;
            margin: 28px 0;
        }

        .quantity button {
            width: 70px;
            height: 58px;
            font-size: 30px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        #count {
            min-width: 40px;
            font-size: 30px;
            font-weight: bold;
        }

        #orderButton {
            width: 100%;
            min-height: 55px;
            font-size: 18px;
            color: white;
            background: #333;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #message {
            color: #c0392b;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>注文確認</h1>

        <img id="menuImage" src="" alt="商品画像">

        <p id="selectedMenu"></p>

        <div class="quantity">
            <button type="button" id="minus">−</button>
            <span id="count">1</span>
            <button type="button" id="plus">＋</button>
        </div>

        <button type="button" id="orderButton">
            注文ボタンの動作テスト
        </button>

        <p id="message"></p>
    </div>

    <script>
        // 選択された商品を取得
        const menu = localStorage.getItem("menu");
        const image = localStorage.getItem("image");

        const menuElement =
            document.getElementById("selectedMenu");

        const imageElement =
            document.getElementById("menuImage");

        const countElement =
            document.getElementById("count");

        const messageElement =
            document.getElementById("message");

        let count = 1;

        // 商品名を表示
        if (menu) {
            menuElement.textContent = menu;
        } else {
            menuElement.textContent = "商品が選択されていません";
        }

        // 商品画像を表示
        if (image) {
            imageElement.src = image;
        } else {
            imageElement.hidden = true;
        }

        // 数量を表示
        function updateCount() {
            countElement.textContent = count;
        }

        // ＋ボタン
        document.getElementById("plus")
            .addEventListener("click", function () {
                count++;
                updateCount();
                messageElement.textContent = "";
            });

        // −ボタン
        document.getElementById("minus")
            .addEventListener("click", function () {
                if (count > 1) {
                    count--;
                    updateCount();
                }
                messageElement.textContent = "";
            });

        // 注文ボタンの動作テスト
        document.getElementById("orderButton")
            .addEventListener("click", function () {
                if (!menu) {
                    messageElement.textContent =
                        "商品が選択されていません。メニュー画面に戻ってください。";
                    return;
                }

                messageElement.style.color = "#18794e";
                messageElement.textContent =
                    "ボタン正常！ " + menu +
                    " を " + count + " 個選択中です。";
            });
    </script>
</body>
</html>
